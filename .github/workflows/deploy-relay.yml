name: deploy relay

# redeploy the relay when its code changes, so a readme push doesn't restart it
on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'src/config/**'
      - 'src/integrations/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-relay.yml'
  workflow_dispatch:

concurrency:
  group: deploy-relay
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  vm:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # the key on the VM can only run relay-deploy, which installs this tree and restarts the relay.
      # A re-run of an older commit uploads nothing, or it would roll the relay back
      - name: Upload the relay to the VM
        env:
          RELAY_KEY: ${{ secrets.VM_RELAY_KEY }}
          KNOWN_HOSTS: ${{ vars.VM_KNOWN_HOSTS }}
          VM_HOST: ${{ vars.VM_HOST }}
        run: |
          head="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice::main is now at $head, this run uploads nothing"
            exit 0
          fi
          install -m 700 -d ~/.ssh
          (umask 077 && printf '%s\n' "$RELAY_KEY" > ~/.ssh/relay_key)
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          git archive --format=tar.gz HEAD | ssh -i ~/.ssh/relay_key -o IdentitiesOnly=yes -o BatchMode=yes "bff-deploy@$VM_HOST" "$GITHUB_SHA"

  # render keeps serving the dashboard until the dns moves to the VM
  render:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: trigger render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK secret is not set; skipping"
            exit 0
          fi
          curl -fsS --max-time 60 -X POST "$HOOK"
          echo "render deploy triggered"
