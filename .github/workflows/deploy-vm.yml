name: Deploy front to the VM

on:
  push:
    branches: [main]
  workflow_dispatch:

# one upload at a time: a newer push waits rather than cutting an upload short
concurrency:
  group: deploy-vm
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # vite bakes these into the public bundle, so they are plain repo variables, not secrets
      - name: Build
        env:
          VITE_WALLETCONNECT_PROJECT_ID: ${{ vars.VITE_WALLETCONNECT_PROJECT_ID }}
          VITE_LOBSTER_API_URL: ${{ vars.VITE_LOBSTER_API_URL }}
          VITE_DOCS_URL: ${{ vars.VITE_DOCS_URL }}
          VITE_GRAFANA_URL: ${{ vars.VITE_GRAFANA_URL }}
        run: |
          for v in VITE_WALLETCONNECT_PROJECT_ID VITE_LOBSTER_API_URL VITE_DOCS_URL VITE_GRAFANA_URL; do
            [ -n "${!v}" ] || { echo "repo variable $v is empty" >&2; exit 1; }
          done
          npm run build
          grep -rqF "\"$VITE_LOBSTER_API_URL\"" dist/assets || { echo "the bundle does not call $VITE_LOBSTER_API_URL" >&2; exit 1; }

      # the key on the VM can only run site-deploy, which takes the sha as release id
      - name: Upload to the VM
        env:
          DEPLOY_KEY: ${{ secrets.VM_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ vars.VM_KNOWN_HOSTS }}
          VM_HOST: ${{ vars.VM_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          tar -C dist -czf - . | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes "deploy@$VM_HOST" "$GITHUB_SHA"

      # asks the VM itself, whatever the DNS says; -k because the certificate check is not the point here
      - name: Check the VM serves this build
        env:
          VM_HOST: ${{ vars.VM_HOST }}
        run: |
          host="$(grep -m 1 -E '^[a-z0-9.-]+ \{$' scripts/vm/stellar-instit.caddy | cut -d ' ' -f 1)"
          entry="$(grep -o 'assets/index-[A-Za-z0-9_-]*\.js' dist/index.html | head -n 1)"
          curl -fsSk --resolve "$host:443:$VM_HOST" "https://$host/" | grep -q "$entry" && exit 0
          echo "the VM does not serve $entry for $host" >&2
          exit 1
