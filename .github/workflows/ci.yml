name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # vite bakes the relay url in at build time and the custody panels (and the
    # specs that drive them) only render with one, so it has to be set for the
    # build, not only for playwright. both values are fake on purpose: the specs
    # mock the relay with page.route, and anything they miss goes to 127.0.0.1
    # and gets refused. don't point these at prod.
    env:
      VITE_LOBSTER_API_URL: http://127.0.0.1:8787
      VITE_LOBSTER_API_TOKEN: ci-placeholder-token

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # the root tsconfig only lists project references, so a plain
      # `tsc --noEmit` type-checks nothing. build the way vercel does instead,
      # so ci fails whenever the deploy would.
      - name: Build (tsc -b + vite build, same as Vercel)
        run: npm run build

      - name: ESLint
        run: npx eslint .
        continue-on-error: true

      - name: Unit tests (Vitest)
        run: npm run test:unit

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        # no --with-deps: its apt install hangs the job, and the runner image
        # already has the chromium libraries
        run: npx playwright install chromium

      # no PLAYWRIGHT_BASE_URL, so the config serves the build above and the
      # specs test this commit rather than whatever is live. set it to
      # https://stellar-instit.lobster-protocol.com to smoke the real deploy.
      - name: Playwright E2E (local build of this commit)
        run: npx playwright test --reporter=list
        env:
          PLAYWRIGHT_HEADLESS: 'true'
