openapi: 3.1.0
info:
  title: Lobster BFF
  version: 0.1.0
  description: >
    Backend for the Lobster dashboard. It wraps the DFNS custody service and a
    few reads. The custody routes are gated on an API token (LOBSTER_API_TOKEN);
    with no token set the gate is open for local dev. The DFNS reads answer 502
    when the upstream call fails or the credentials are missing, and the sign
    path answers 503 until its env is in place. Creating a wallet, deciding an
    approval and paying a CCTP delivery also take the operator token
    (LOBSTER_OPERATOR_TOKEN), and stay shut until it is set.
servers:
  - url: https://lobster-bff.onrender.com
    description: deployed relay
  - url: http://localhost:8787
    description: local dev (hono)
tags:
  - name: health
  - name: monitoring
  - name: dfns
  - name: allbridge
  - name: cctp
security:
  - lobsterToken: []
  - bearerAuth: []
paths:
  /health:
    get:
      tags: [health]
      summary: Liveness and service name
      security: []
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }
                  service: { type: string }
  /ttl:
    get:
      tags: [monitoring]
      summary: Contract storage TTL per ledger key
      description: >
        Reads the Soroban storage entries for the deployed contracts and returns
        each key's remaining runway in ledgers and seconds, with a band of
        ok / warn / crit / archived. Public read. Answers 503 when the factory
        is not deployed on the requested network.
      security: []
      parameters:
        - name: network
          in: query
          required: false
          schema: { type: string, enum: [testnet, mainnet] }
      responses:
        '200': { description: ttl report }
        '503': { description: factory not deployed on this network }
  /metrics:
    get:
      tags: [monitoring]
      summary: Prometheus metrics for the relay
      description: >
        Request durations (http_request_duration_seconds) and DFNS approvals by
        status (lobster_dfns_approvals), in the Prometheus text format, for a
        scraper. The route stays off, and answers 404, until METRICS_TOKEN is set
        on the relay. After that it wants that token.
      security:
        - metricsToken: []
      responses:
        '200': { description: metrics in the Prometheus text format }
        '401': { description: token missing or wrong }
        '404': { description: "METRICS_TOKEN not set, so the route is off" }
  /dfns/wallets:
    get:
      tags: [dfns]
      summary: List custody wallets
      responses:
        '200': { description: wallet list }
        '401': { description: token required and missing or wrong }
        '502': { description: DFNS read failed or not configured }
    post:
      tags: [dfns]
      summary: Create a Stellar custody wallet
      description: >
        Takes the operator token on top of the shared token, and answers 503
        until both are set on the relay.
      security:
        - lobsterToken: []
          operatorToken: []
        - bearerAuth: []
          operatorToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, network]
              properties:
                name: { type: string }
                network: { type: string, enum: [Stellar, StellarTestnet] }
      responses:
        '200': { description: created }
        '400': { description: "bad json, or name or network missing or invalid" }
        '401': { description: shared or operator token missing or wrong }
        '429': { description: over RATE_LIMIT_PER_MIN calls from this ip in a minute }
        '502': { description: DFNS create failed or not configured }
        '503': { description: "API token or operator token not set, so wallet creation is disabled" }
  /dfns/policies:
    get:
      tags: [dfns]
      summary: List approval policies
      responses:
        '200': { description: policy list }
        '401': { description: token required and missing or wrong }
        '502': { description: DFNS read failed or not configured }
  /dfns/approvals:
    get:
      tags: [dfns]
      summary: List pending approvals
      responses:
        '200': { description: pending approvals }
        '401': { description: token required and missing or wrong }
        '502': { description: DFNS read failed or not configured }
  /dfns/approvals/{id}/decision:
    post:
      tags: [dfns]
      summary: Approve or deny a pending signature
      description: >
        Fail-closed like /dfns/sign: deciding an approval authorizes a pending
        treasury signature, so it answers 503 unless the API token is set. It
        also takes the operator token, and answers 503 until that one is set too.
      security:
        - lobsterToken: []
          operatorToken: []
        - bearerAuth: []
          operatorToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value: { type: string, enum: [Approved, Denied] }
                reason: { type: string }
      responses:
        '200': { description: decision recorded }
        '400': { description: "missing id, bad json, or value not Approved/Denied" }
        '401': { description: shared or operator token missing or wrong }
        '429': { description: over RATE_LIMIT_PER_MIN calls from this ip in a minute }
        '503': { description: "API token or operator token not set, so approvals are disabled" }
        '502': { description: DFNS decision call failed }
  /dfns/sign:
    post:
      tags: [dfns]
      summary: Sign and broadcast a Stellar tx via MPC
      description: >
        Inspects the XDR against the sign guard (op allowlist, treasury source,
        destination whitelist, amount cap, fee ceiling), then signs through DFNS.
        A Soroban invocation passes in two cases only. One is a read-only view
        with no arguments and no authorization entries, on a contract listed in
        DFNS_SOROBAN_VIEW_CONTRACTS (our own factory when that is unset). The
        other is a vault deposit or withdraw_contract on a contract listed in
        DFNS_SOROBAN_TREASURY_CONTRACTS, and its first argument has to be the
        treasury, since that is the account the vault pulls from or pays back to.
        Anything else is refused. Fee-bump and restoreFootprint envelopes are
        refused too.

        Success looks different depending on what you sent. DFNS broadcasts a
        classic tx itself, so that answer is {txHash}. A Soroban tx comes back as
        {signedTxXdr} for the caller to submit. If an approval policy is holding
        the request you get {pending: true, id} instead, and you poll
        /dfns/sign/{id}/status for the hash once it clears. Fail-closed: 503 when
        the API token, the wallet id, or the guard env is unset.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [xdr]
              properties:
                xdr: { type: string, description: base64 transaction envelope }
                networkPassphrase:
                  type: string
                  description: optional, must match the server's configured network
      responses:
        '200': { description: "signed xdr, broadcast hash, or a pending approval id" }
        '400': { description: "bad json, missing xdr, network mismatch, fee-bump or restoreFootprint envelope, or blocked by the sign guard" }
        '401': { description: token required and missing or wrong }
        '409': { description: a treasury signature is already awaiting approval; body carries pending and id }
        '429': { description: over RATE_LIMIT_PER_MIN calls from this ip in a minute }
        '502': { description: DFNS rejected or failed the signature }
        '503': { description: "API token, wallet id, or sign guard not configured" }
  /dfns/sign/{id}/status:
    get:
      tags: [dfns]
      summary: Poll a signature held for approval
      description: >
        Reads the current DFNS status of a signature that /dfns/sign returned as
        pending. The multi-approver flow depends on it: the dashboard shows the
        pending state, polls here, and gets the transaction hash once a second
        identity approves. Returns status, txHash, signedTxXdr and reason. DFNS
        does not broadcast a Soroban tx, so once one is signed the poll hands
        back its envelope as signedTxXdr for the caller to submit, as /dfns/sign
        does.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: the signature id /dfns/sign handed back with pending
      responses:
        '200':
          description: "current status, with txHash once it has broadcast, or signedTxXdr once a Soroban tx is signed"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  txHash: { type: string }
                  signedTxXdr: { type: string, description: base64 signed transaction envelope }
                  reason: { type: string }
        '400': { description: missing signature id }
        '401': { description: token required and missing or wrong }
        '429': { description: over RATE_LIMIT_PER_MIN calls from this ip in a minute }
        '502': { description: DFNS read failed }
        '503': { description: DFNS_STELLAR_WALLET_ID not set }
  /dfns/transfer:
    post:
      tags: [dfns]
      summary: Pay XLM from the treasury as a DFNS transfer
      description: >
        DFNS builds this payment itself, which makes it the one request whose
        amount and recipient a DFNS policy rule can read; a raw /dfns/sign
        request is held by any such rule. The destination has to be on
        DFNS_DESTINATION_WHITELIST and the amount within DFNS_MAX_AMOUNT_STROOPS,
        the same bounds /dfns/sign applies. When a policy holds the payment,
        held is true and approvalId names the approval to decide. Fail-closed
        like /dfns/sign: 503 when the API token, the wallet id, or the guard env
        is unset.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, stroops]
              properties:
                to: { type: string, description: "Stellar account id the treasury pays, G plus 55 base32" }
                stroops: { type: string, description: "amount as a positive whole number of stroops, 1 XLM = 10000000" }
      responses:
        '200':
          description: "the DFNS transfer request, held for approval or already sent"
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  status: { type: string }
                  approvalId: { type: [string, 'null'] }
                  txHash: { type: [string, 'null'] }
                  held: { type: boolean }
        '400': { description: "bad json, to or stroops missing, or blocked by the sign guard" }
        '401': { description: token required and missing or wrong }
        '429': { description: over RATE_LIMIT_PER_MIN calls from this ip in a minute }
        '502': { description: DFNS rejected or failed the transfer }
        '503': { description: "API token, wallet id, or sign guard not configured" }
  /dfns/audit/export:
    get:
      tags: [dfns]
      summary: MiCA audit export, CDR 2025/1140, hash-chained
      responses:
        '200': { description: audit records }
        '401': { description: token required and missing or wrong }
        '500': { description: "the record hash chain does not verify, so nothing is exported" }
  /webhooks/dfns:
    post:
      tags: [dfns]
      summary: DFNS inbound webhook, HMAC verified
      description: >
        Verifies the HMAC signature in constant time, drops replays outside the
        time window, and de-duplicates on the event id. Not token-gated; the
        HMAC is the auth.
      security: []
      responses:
        '200': { description: "accepted, or acknowledged and dropped when the event was already received" }
        '400': { description: the payload is not a DFNS event }
        '401': { description: "signature missing or wrong, or the event was sent outside the replay window" }
  /sse:
    get:
      tags: [dfns]
      summary: Server-sent stream of signature and policy activity
      description: >
        EventSource cannot set headers, so this route also takes the token as
        ?token=. No other route accepts it in the query.
      security:
        - lobsterToken: []
        - bearerAuth: []
        - lobsterQueryToken: []
      responses:
        '200': { description: event stream }
        '401': { description: token required and missing or wrong }
  /allbridge/tokens:
    get:
      tags: [allbridge]
      summary: Tokens Allbridge Core lists for a source chain
      description: >
        Read-only passthrough to the Allbridge Core API. Allbridge is mainnet
        only, so these routes always target mainnet. None of them are
        token-gated: nothing here signs or holds a secret.
      security: []
      parameters:
        - name: chain
          in: query
          required: true
          schema: { type: string, enum: [ETH, ARB] }
      responses:
        '200': { description: "token list, each with symbol, decimals, tokenAddress, bridgeAddress, chainSymbol" }
        '400': { description: chain must be ETH or ARB }
        '502': { description: Allbridge call failed }
  /allbridge/quote:
    post:
      tags: [allbridge]
      summary: Quote a USDC transfer into Stellar
      description: >
        Returns amountIn, amountOut, etaSeconds (null when the corridor omits a
        transfer time) and gasFeeOptions keyed by payment method. Allbridge has
        removed its pools and lists no route into Stellar, so this route answers
        502 and says so. The bridge runs on the cctp routes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceChain, amount]
              properties:
                sourceChain: { type: string, enum: [ETH, ARB] }
                amount:
                  type: string
                  description: positive USDC amount, at most 6 decimals
      responses:
        '200': { description: quote }
        '400': { description: body failed validation }
        '502': { description: Allbridge call failed }
  /allbridge/status:
    get:
      tags: [allbridge]
      summary: Delivery status of a transfer
      description: >
        Delivery on Stellar is automatic; this is how a caller learns the
        transfer landed. txId is the EVM hash the send returned.
      security: []
      parameters:
        - name: chain
          in: query
          required: true
          schema: { type: string, enum: [ETH, ARB] }
        - name: txId
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { description: transfer status }
        '400': { description: "chain must be ETH or ARB, or txId missing" }
        '502': { description: Allbridge call failed }
  /allbridge/raw/approve:
    post:
      tags: [allbridge]
      summary: Build an unsigned ERC-20 approve for the bridge
      description: >
        Build only. The caller's wallet or custodial signer signs and broadcasts;
        this service never does.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceChain, amount, owner]
              properties:
                sourceChain: { type: string, enum: [ETH, ARB] }
                amount: { type: string, description: "positive USDC amount, at most 6 decimals" }
                owner: { type: string, description: "EVM address, 0x plus 40 hex" }
      responses:
        '200': { description: rawTx }
        '400': { description: body failed validation }
        '502': { description: Allbridge call failed }
  /allbridge/raw/send:
    post:
      tags: [allbridge]
      summary: Build an unsigned bridge send from EVM to Stellar
      description: >
        Refused with a 502 while Allbridge lists no route into Stellar, rather
        than building a send that would leave the funds on the source chain.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceChain, amount, fromAddress, toAddress]
              properties:
                sourceChain: { type: string, enum: [ETH, ARB] }
                amount: { type: string, description: "positive USDC amount, at most 6 decimals" }
                fromAddress: { type: string, description: "EVM address, 0x plus 40 hex" }
                toAddress: { type: string, description: "Stellar account id, G plus 55 base32" }
      responses:
        '200': { description: rawTx }
        '400': { description: body failed validation }
        '502': { description: Allbridge call failed }
  /cctp/chains:
    get:
      tags: [cctp]
      summary: The EVM chains the bridge carries USDC between Stellar and
      description: >
        The EVM chains Circle CCTP carries USDC from and back to, with the
        contracts each side goes through. Stellar is CCTP domain 27.
      security: []
      parameters:
        - name: network
          in: query
          required: true
          schema: { type: string, enum: [testnet, mainnet] }
      responses:
        '200': { description: "destinationDomain; stellar with its domain, the forwarder a burn into Stellar names as mintRecipient and destinationCaller, Circle's USDC issuer and SAC, and the TokenMessengerMinter and MessageTransmitter a burn out of Stellar goes through; directions; items with key, name, domain, chainId, usdc, tokenMessenger, messageTransmitter" }
        '400': { description: network must be testnet or mainnet }
  /cctp/fees:
    get:
      tags: [cctp]
      summary: Circle's fees, either way
      description: >
        Into Stellar, basis points for a fast transfer and for a standard one,
        read live from Circle; a null fastBps means Circle offers no fast route
        from there. Out of Stellar (domain 27 with a destination), what Circle
        charges to mint the USDC on that chain itself, in 6-decimal units. Circle
        keeps all of it.
      security: []
      parameters:
        - name: network
          in: query
          required: true
          schema: { type: string, enum: [testnet, mainnet] }
        - name: domain
          in: query
          required: true
          schema: { type: integer }
          description: CCTP domain of the chain that burns, 0 Ethereum, 3 Arbitrum, 6 Base, 27 Stellar
        - name: destination
          in: query
          required: false
          schema: { type: integer }
          description: with domain 27, the EVM chain the USDC goes to
      responses:
        '200': { description: "fastBps and standardBps; with domain 27, sourceDomain, destinationDomain, forwardFee and bps" }
        '400': { description: not a chain we carry USDC from or to }
        '502': { description: Circle did not answer }
  /cctp/message:
    get:
      tags: [cctp]
      summary: Where a burn stands, and who it pays
      description: >
        Asks Circle for the message behind a burn and decodes it. Pending until
        Circle has signed. Once signed it gives the account the transfer pays,
        a Stellar account on the way in and an EVM address on the way out, the
        amount burned and the amount that lands after Circle's fee, in 6-decimal
        units. Out of Stellar it also gives Circle's own mint, forwardState and
        forwardTxHash, and the message and attestation an EVM wallet submits to
        receiveMessage when it mints the USDC itself.
      security: []
      parameters:
        - name: network
          in: query
          required: true
          schema: { type: string, enum: [testnet, mainnet] }
        - name: domain
          in: query
          required: true
          schema: { type: integer }
        - name: txHash
          in: query
          required: true
          schema: { type: string }
          description: the burn transaction hash, 0x plus 64 hex on an EVM chain, 64 hex on Stellar
      responses:
        '200': { description: "state pending with delayReason, or state attested with recipient, amount, amountToLand, feeExecuted, expirationLedger; out of Stellar also forwardState, forwardTxHash, message and attestation" }
        '400': { description: "bad network, domain or hash" }
        '502': { description: Circle did not answer }
  /cctp/deliver:
    post:
      tags: [cctp]
      summary: Deliver a signed transfer on Stellar and pay the fee
      description: >
        Runs the last step for an account that does not sign from a browser. The
        message is never taken from the caller: the service asks Circle for it
        by burn hash and only submits once it pays the recipient named here,
        through the forwarder of the network named here. Shut unless a relay key
        is configured, testnet only unless mainnet is switched on separately,
        and capped per day. It spends the relay account's XLM, so it takes the
        operator token on top of the shared token.
      security:
        - lobsterToken: []
          operatorToken: []
        - bearerAuth: []
          operatorToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [network, sourceDomain, txHash, recipient]
              properties:
                network: { type: string, enum: [testnet, mainnet] }
                sourceDomain: { type: integer }
                txHash: { type: string, description: "EVM burn hash, 0x plus 64 hex" }
                recipient: { type: string, description: "Stellar account id, G plus 55 base32" }
      responses:
        '200': { description: "delivered with the Stellar hash and the amount, or already-delivered" }
        '400': { description: "body failed validation, or the transfer does not pay that recipient" }
        '401': { description: shared or operator token missing or wrong }
        '404': { description: Circle has not signed the burn yet }
        '409': { description: the recipient has no USDC trustline }
        '429': { description: over RATE_LIMIT_PER_MIN calls from this ip in a minute }
        '502': { description: Stellar or Circle refused }
        '503': { description: "operator token or relay not configured, network not enabled, daily cap reached, or Circle has paused deliveries" }
components:
  securitySchemes:
    lobsterToken:
      type: apiKey
      in: header
      name: x-lobster-token
      description: >
        Shared token (LOBSTER_API_TOKEN). Also accepted as a bearer token, and on
        /sse only as a ?token= query parameter. Omitted when no token is set.
    lobsterQueryToken:
      type: apiKey
      in: query
      name: token
      description: >
        The shared token as a query parameter, for EventSource, which cannot set
        headers. Only /sse takes it.
    bearerAuth:
      type: http
      scheme: bearer
    operatorToken:
      type: apiKey
      in: header
      name: x-lobster-operator-token
      description: >
        Operator token (LOBSTER_OPERATOR_TOKEN), for routes that spend or write.
        It never reaches the browser. Unset means those routes stay shut.
    metricsToken:
      type: apiKey
      in: header
      name: x-metrics-token
      description: >
        Scrape token for /metrics (METRICS_TOKEN), separate from the API token.
        Also accepted as a bearer token.
